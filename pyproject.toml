# Development environment for the Proavus tools and tests (uv).
# The tools themselves declare the same pinned dependencies in their PEP 723
# header, so they also run from the copy .proavus/ in a family repository.
[project]
name = "proavus-tools"
version = "0.7.0"
description = "Tools of the Proavus genealogy framework"
requires-python = ">=3.11"
dependencies = [
  "pyyaml==6.0.2",
  "jsonschema==4.23.0",
]

[tool.uv]
package = false
