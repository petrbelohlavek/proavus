# Proavus: check every change. Only checks, never writes (ADR 0019).
# Actions pinned to a commit SHA, the token can only read (Proavus ADR 0043);
# /proavus:upgrade brings new versions – do not edit by hand.
name: validate
on:
  push:
  pull_request:
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run .proavus/tools/validate.py .
