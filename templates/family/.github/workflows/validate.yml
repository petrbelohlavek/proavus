# Proavus: check every change. Only checks, never writes (ADR 0019).
# Actions pinned to a commit SHA, the token can only read (Proavus ADR 0043);
# /proavus:upgrade brings new versions – do not edit by hand.
name: validate
on:
  push:
  pull_request:
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv run .proavus/tools/validate.py .
